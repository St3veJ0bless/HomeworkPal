<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lernplaner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#3b5bdb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lernplaner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#f4f3ef;--card:#fff;--tx:#1d1d1b;--mut:#77756e;--bd:#e4e2da;--ac:#3b5bdb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121215;--card:#1f1f24;--tx:#efeee9;--mut:#9a98a0;--bd:#33333a}}
:root[data-theme="dark"]{--bg:#121215;--card:#1f1f24;--tx:#efeee9;--mut:#9a98a0;--bd:#33333a}
html{height:100%;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
svg{display:block}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 6px;max-width:640px;width:100%;margin:0 auto}
h1{font-size:26px;margin:0}
main{flex:1;overflow-y:auto;padding:8px 16px 130px;max-width:640px;width:100%;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--ac);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;max-width:160px;border:0;background:none;color:#fff;opacity:.65;padding:6px 0;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:14px}
nav button.on{opacity:1;background:rgba(255,255,255,.2)}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 14px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
button.ib{width:40px;height:40px;padding:0;border-radius:50%;background:var(--ac);color:#fff;border:0;display:grid;place-items:center;flex:none}
button.ib.sm{width:32px;height:32px}
button.ic{display:flex;align-items:center;justify-content:center;gap:8px}
button.red{background:#e5484d;color:#fff;border-color:#e5484d}
button:disabled{opacity:.5}
.fab{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;padding:0;background:var(--ac);color:#fff;border:0;box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:6;display:grid;place-items:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:14px}
.mut{color:var(--mut);font-size:14px}
.sec{margin:18px 2px 8px;text-transform:uppercase;letter-spacing:.05em;font-size:14px;color:var(--mut);font-weight:600}
.row{display:flex;gap:8px;align-items:center}
.box{display:flex;align-items:center;gap:12px;min-height:60px;height:auto;padding:14px 14px 14px 16px;border-radius:16px;border-left:6px solid var(--c);background:color-mix(in srgb,var(--c) 20%,var(--card));margin-bottom:10px;cursor:pointer}
.box .bt{flex:1;min-width:0}
.box .n{font-size:16px;font-weight:600;line-height:1.35;overflow-wrap:anywhere;white-space:normal}
.box .dt{font-size:14px;opacity:.85;margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
