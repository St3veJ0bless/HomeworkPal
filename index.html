<!DOCTYPE html>
<html lang="de">
<head>

<style>
:root{--bg:#f4f3ef;--card:#fff;--tx:#1d1d1b;--mut:#77756e;--bd:#e4e2da;--ac:#3b5bdb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121215;--card:#1f1f24;--tx:#efeee9;--mut:#9a98a0;--bd:#33333a}}
:root[data-theme="dark"]{--bg:#121215;--card:#1f1f24;--tx:#efeee9;--mut:#9a98a0;--bd:#33333a}
html{height:100%;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
svg{display:block}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 6px;max-width:640px;width:100%;margin:0 auto}
h1{font-size:26px;margin:0}
main{flex:1;overflow-y:auto;padding:8px 16px 130px;max-width:640px;width:100%;margin:0 auto}
@media(min-width:1000px){header.wide,main.wide{max-width:1500px}.wgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;align-items:start}.wcol{min-width:0}.wcol .dh{margin-top:4px}.wcol .empty{padding:14px 8px;font-size:14px}}
.sj{opacity:.5;font-weight:600;margin-right:2px}
.xt .sj{margin-right:3px}
.sjw{position:relative;margin-top:12px}
.sji{padding-right:40px!important}
.sdd{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--bd);border-radius:14px;max-height:230px;overflow-y:auto;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.sdd[hidden]{display:none}
.sdd button.sdi{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:0;background:none;padding:11px 14px;text-align:left;border-bottom:1px solid var(--bd)}
.sdd button.sdi:last-child{border-bottom:0}
.sdi .dot{width:14px;height:14px;border-radius:50%;flex:none}
.sdi .sj{margin-left:auto}
.srow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}
.srow .sj{width:34px;font-size:17px;opacity:.55}
.srow .sn{flex:1;font-weight:600}
.srow input[type=color]{width:38px;height:38px;padding:0;border:0;background:none;border-radius:50%;overflow:hidden;cursor:pointer;outline:1px solid var(--bd);-webkit-appearance:none;appearance:none}
.srow input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.srow input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
.tdb{padding:8px 14px;font-weight:600;font-size:14px;border-radius:99px}
.tdb.cur{opacity:.5}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--ac);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;max-width:160px;border:0;background:none;color:#fff;opacity:.65;padding:6px 0;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:14px}
nav button.on{opacity:1;background:rgba(255,255,255,.2)}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 14px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
button.ib{width:40px;height:40px;padding:0;border-radius:50%;background:var(--ac);color:#fff;border:0;display:grid;place-items:center;flex:none}
button.ib.sm{width:32px;height:32px}
button.ic{display:flex;align-items:center;justify-content:center;gap:8px}
button.red{background:#e5484d;color:#fff;border-color:#e5484d}
button:disabled{opacity:.5}
.fab{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;padding:0;background:var(--ac);color:#fff;border:0;box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:6;display:grid;place-items:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:14px}
.mut{color:var(--mut);font-size:14px}
.sec{margin:18px 2px 8px;text-transform:uppercase;letter-spacing:.05em;font-size:14px;color:var(--mut);font-weight:600}
.row{display:flex;gap:8px;align-items:center}

/* Segment-Auswahl: Alle | Fällig | Plan */
.sg{display:flex;gap:4px;padding:4px;border-radius:14px;background:color-mix(in srgb,var(--tx) 7%,var(--bg));margin:0 0 14px}
.sg button{flex:1;border:0;background:none;color:var(--mut);font-weight:600;padding:10px 6px;border-radius:11px}
.sg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.18)}

/* Aufgaben-Kästen */
.box{display:flex;align-items:center;gap:12px;min-height:52px;height:auto;padding:12px 14px;border-radius:14px;border:2.5px solid var(--c);margin-bottom:8px;cursor:pointer}
.box .bt{flex:1;min-width:0}
.box .n{font-size:16px;font-weight:600;line-height:1.3;overflow-wrap:anywhere;white-space:normal}
.box .sub{font-size:12px;opacity:.85;margin-top:1px}
.box .wr{flex:none;display:grid;place-items:center}
.box.due{background:var(--c);color:#fff}
.box.due .chk{border-color:#fff;color:transparent}
.box.due.done .chk{background:#fff;color:var(--c)}
.box.plan{background:color-mix(in srgb,var(--c) 18%,var(--card));color:var(--tx)}
.box.plan .chk{border-color:var(--tx);color:transparent}
.box.plan.done .chk{background:var(--tx);color:var(--card)}
.box.plan .wr{color:var(--c)}
.box.done{opacity:.55}
.box.done .n{text-decoration:line-through}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid;background:none;padding:0;display:grid;place-items:center;flex:none}
.dh{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px;min-height:32px}
.dl{display:flex;align-items:center;gap:10px}
.dd{color:var(--mut);font-weight:700;font-size:16px}
.tp{background:var(--tx);color:var(--bg);font-weight:700;font-size:13px;border-radius:99px;padding:3px 12px}
.empty{border:2px dashed var(--bd);border-radius:14px;padding:16px;text-align:center;color:var(--mut);font-size:14px;margin-bottom:8px}
.xb{display:inline-block;background:#c93d2e;color:#fff;font-size:11px;font-weight:700;border-radius:8px;padding:1px 7px;margin-right:4px;vertical-align:1px}
.kb{display:inline-block;background:var(--tx);color:var(--bg);font-size:11px;font-weight:700;border-radius:8px;padding:1px 7px;margin-right:4px;vertical-align:1px}

/* Prüfungs-Karten (Startseite) */
.xs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 12px;-webkit-overflow-scrolling:touch}
.xc{flex:none;width:156px;min-height:178px;scroll-snap-align:start;border-radius:22px;padding:14px;color:#fff;background:linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c) 50%,#000));display:flex;flex-direction:column;gap:8px;cursor:pointer;box-shadow:0 6px 16px color-mix(in srgb,var(--c) 40%,transparent)}
.xd{display:flex;align-items:baseline;gap:6px}
.xd span{text-transform:uppercase;font-size:12px;font-weight:700;opacity:.9;letter-spacing:.05em}
.xd b{font-size:40px;line-height:1}
.xt{flex:1;font-weight:600;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.xcd{align-self:flex-start;background:rgba(255,255,255,.25);padding:4px 11px;border-radius:99px;font-size:12px;font-weight:700}

.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.wd{border:0;background:none;padding:4px 0;border-radius:12px;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--mut)}
.wd b{font-size:16px;color:var(--tx);width:34px;height:34px;line-height:34px;border-radius:50%}
.wd.today b{color:var(--ac)}
.wd.sel b{background:var(--ac);color:#fff}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}

/* Blätter / Formulare */
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheetbg.c{align-items:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94%;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0;font-size:20px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input[type=text],input[type=email],input[type=password],input[type=date],textarea,select{width:100%;min-width:0;font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
textarea{min-height:110px;resize:vertical}
.sheet input.ti{font-size:26px;font-weight:700;border:0;border-bottom:1px solid var(--bd);border-radius:0;background:none;padding:10px 2px;margin-top:4px}
.sheet textarea.ds{border:0;background:color-mix(in srgb,var(--tx) 6%,var(--bg));min-height:90px;margin-top:12px;border-radius:16px;padding:14px}
.fc{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:14px 0}
.fh{display:flex;justify-content:space-between;align-items:center;gap:12px}
.fh b{font-size:19px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.g2>div{min-width:0}
input[type=date]{min-width:0;max-width:100%;min-height:46px}
label.sw2{position:relative;display:inline-block;width:52px;height:32px;flex:none;margin:0}
.sw2 input{opacity:0;width:0;height:0;position:absolute}
.sw2 span{position:absolute;inset:0;border-radius:99px;background:color-mix(in srgb,var(--tx) 20%,var(--bg));transition:.15s}
.sw2 span::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:.15s}
.sw2 input:checked+span{background:var(--ac)}
.sw2 input:checked+span::after{transform:translateX(20px)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--bd);border-radius:99px;padding:9px 16px;background:var(--card);font-weight:600}
.chip.on{border:2px solid var(--tx);padding:8.5px 15.5px}
.chip i{width:14px;height:14px;border-radius:50%;background:#c93d2e;display:inline-block}
.dayrow{display:flex;gap:8px;align-items:center;margin-top:8px}
.dw{width:30px;color:var(--mut);font-weight:700;font-size:14px;flex:none}
button.sq{width:44px;height:44px;padding:0;display:grid;place-items:center;flex:none}
label.ck{display:flex;gap:12px;align-items:center;font-size:17px;color:var(--tx);margin:16px 2px 4px}
.ck input{width:24px;height:24px;flex:none;accent-color:var(--ac)}
.ck .mut{font-size:13px}
.sw{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw i{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent;outline:1px solid var(--bd)}
.sw i.on{border-color:var(--bg);outline:2px solid var(--tx)}
.sw input[type=color]{width:34px;height:34px;padding:0;border:0;background:none;border-radius:50%;overflow:hidden;cursor:pointer;outline:1px solid var(--bd);-webkit-appearance:none;appearance:none}
.sw input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.sw input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
.sw input[type=color]::-moz-color-swatch{border:0;border-radius:50%}
.ai{white-space:pre-wrap;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:10px;font-size:14px}
.big{font-size:28px;font-weight:700}
.bar{height:10px;border-radius:5px;background:var(--bd);overflow:hidden;margin-top:8px}
.bar div{height:100%;background:var(--ac)}
.file{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;padding:8px 10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;font-size:14px}
.login{max-width:380px;margin:12vh auto 0}
.login h1{text-align:center;margin-bottom:6px}
.user{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.user:first-of-type{border-top:0}
.user .u{flex:1;min-width:0;overflow-wrap:anywhere}
.badge{font-size:11px;background:var(--ac);color:#fff;border-radius:8px;padding:2px 6px;margin-left:6px;vertical-align:middle}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:#222;color:#fff;padding:10px 16px;border-radius:12px;z-index:50;max-width:88%;font-size:14px;text-align:center}

/* Update-Fenster und Prüf-Bildschirm */
.pop{background:var(--bg);width:100%;max-width:420px;max-height:86%;overflow-y:auto;border-radius:24px;padding:22px 20px 18px;margin:16px}
.pop .pi{width:48px;height:48px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;margin-bottom:12px}
.pop h3{font-size:22px;margin:2px 0 0}
.pop .pb{white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0 18px}
.sheet.rv{display:flex;flex-direction:column;overflow:hidden;height:92%}
.rl{flex:1;overflow-y:auto;margin:0 -4px;padding:0 4px}
.rd{font-weight:700;font-size:14px;margin:14px 0 6px;color:var(--mut)}
.ri{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;border-left:6px solid var(--c);background:color-mix(in srgb,var(--c) 18%,var(--card));margin:0 0 8px;cursor:pointer;color:var(--tx);font-size:16px}
.ri.off{opacity:.4}
.ri input{width:22px;height:22px;margin-top:1px;flex:none;accent-color:var(--ac)}
.ri.dng input{accent-color:#e5484d}
.ri .n{font-weight:600;overflow-wrap:anywhere}
.ri .rdt{font-size:13px;color:var(--mut);margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.rf{display:flex;gap:8px;padding-top:12px}
.rf button{flex:1}
</style>
</head>

const sjTag=t=>t.subject&&sjAbbr(t.subject)?`<span class="sj">${esc(sjAbbr(t.subject))}:</span> `:'';
let tab='home',prev='home',sel=TODAY,cv='day',pwOpen=false,annOpen=false,flt='all';
const LS='lernplaner-set';
let SET={accent:'#3b5bdb',theme:'auto'};
try{Object.assign(SET,JSON.parse(localStorage.getItem(LS)||'{}'))}catch(e){}

function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3800)}
function applyTheme(){const r=document.documentElement;SET.theme==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',SET.theme);r.style.setProperty('--ac',SET.accent)}

async function callFn(name,body){
  const {data,error}=await sb.functions.invoke(name,{body});
  if(error){let m=error.message;try{const j=await error.context.json();if(j&&j.error)m=j.error}catch(e){}throw new Error(m)}
  if(data&&data.error)throw new Error(data.error);
  return data;
}

/* ---------- Aufgaben: Hilfsfunktionen ---------- */
// kind: 'due' = fällig (Abgabe/Prüfung), 'plan' = "Ich mache es am"
const isDue=t=>t.kind==='due',isExam=t=>t.kind==='due'&&t.ttype==='exam';
const endOf=t=>t.date_to||t.date;
const onDay=(t,k)=>isDue(t)?(k>=t.date&&k<=endOf(t)):t.date===k;
const clr=t=>t.ttype==='exam'?EXAM:t.color;
const cmp=(a,b)=>(isExam(b)-isExam(a))||(!!b.urgent-!!a.urgent)||((isDue(a)?0:1)-(isDue(b)?0:1))||a.title.localeCompare(b.title);
const cmpD=(a,b)=>a.date.localeCompare(b.date)||cmp(a,b);
const fl=t=>flt==='all'||(flt==='due'?isDue(t):!isDue(t));
const monOf=s=>{const d=D(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return d};

/* ---------- Daten laden / speichern ---------- */
async function loadAll(){
  const [p,t,chk,chs,sc]=await Promise.all([
    sb.from('profiles').select('*').eq('id',U.id).maybeSingle(),
    sb.from('tasks').select('*').order('date'),
    sb.from('tasks').select('kind').limit(1),
    sb.from('tasks').select('subject').limit(1),
    sb.from('subject_colors').select('*')
  ]);
  HAS_SUBJ=!chs.error;SC={};
  if(!sc.error)(sc.data||[]).forEach(r=>{SC[r.subject]=r.color});
  PROFILE=p.data||{name:'',email:U.email,is_admin:false};
  TASKS=t.data||[];
  if(chk.error)toast('Bitte zuerst das SQL-Update 2 (update-2-planer.sql) in Supabase ausführen.');
  else if(chs.error)toast('Für die Fächer bitte das SQL-Update 3 (update-3-faecher.sql) in Supabase ausführen.');
  // Aufräumen: Aufgaben, die mehr als 30 Tage zurückliegen, löschen
  const lim=iso(addDays(new Date(),-30)),old=TASKS.filter(x=>endOf(x)<lim);
  if(old.length){await delIds(old.map(x=>x.id)).catch(()=>{})}
}
async function delIds(ids){
  for(let i=0;i<ids.length;i+=40){
    const {error}=await sb.from('tasks').delete().in('id',ids.slice(i,i+40));
    if(error)throw error;
  }
  const gone=new Set(ids);TASKS=TASKS.filter(x=>!gone.has(x.id));
}
async function addTasks(rows){
  const {data,error}=await sb.from('tasks').insert(rows).select();
  if(error)throw error;TASKS.push(...data);return data;
}
async function updTask(t,patch){
  const {error}=await sb.from('tasks').update(patch).eq('id',t.id);
  if(error)throw error;Object.assign(t,patch);
}

/* ---------- Newsletter / Update-Ankündigungen ---------- */
async function loadAnn(){
  ANN=[];
  const [a,r]=await Promise.all([
    sb.from('announcements').select('*').order('created_at',{ascending:false}).limit(50),
    sb.from('announcement_reads').select('announcement_id')
  ]);
  if(a.error||r.error)return [];   // Tabellen fehlen noch (SQL-Update 1 nicht ausgeführt): still ignorieren
  ANN=a.data||[];
  const seen=new Set((r.data||[]).map(x=>x.announcement_id));
  const since=PROFILE&&PROFILE.created_at?new Date(PROFILE.created_at):new Date(0);
  return ANN.filter(x=>!seen.has(x.id)&&new Date(x.created_at)>=since).reverse();
}
async function markRead(id){try{await sb.from('announcement_reads').insert({announcement_id:id})}catch(e){}}
function showAnn(list){
  if(!list.length)return;
  const a=list[0],bg=document.createElement('div');bg.className='sheetbg c';bg.style.zIndex=40;
  bg.innerHTML=`<div class="pop" role="dialog"><div class="pi">${I('spark',24)}</div><div class="mut">Neu im Lernplaner · ${fmt(a.created_at.slice(0,10),{day:'numeric',month:'long',year:'numeric'})}</div><h3>${esc(a.title)}</h3><div class="pb">${esc(a.body)}</div><button class="p" id="annok" style="width:100%">Verstanden</button></div>`;
  document.body.appendChild(bg);
  markRead(a.id);   // sofort als gelesen markieren: erscheint nie ein zweites Mal
  bg.querySelector('#annok').onclick=()=>{bg.remove();showAnn(list.slice(1))};
}
async function checkAnn(){try{showAnn(await loadAnn())}catch(e){}}

/* ---------- Ansichten ---------- */
const kindChip=t=>isExam(t)?'<span class="xb">Prüfung</span>':isDue(t)?'<span class="kb">Abgabe</span>':'';
const box=t=>{
  const due=isDue(t),warn=isExam(t),rng=due&&t.date_to&&t.date_to>t.date;
  return `<div class="box ${due?'due':'plan'}${t.done?' done':''}" data-e="${t.id}" style="--c:${esc(clr(t))};--wc:${due?esc(clr(t)):'var(--card)'}"><button class="chk" data-c="${t.id}" aria-label="Erledigt">${I('check',16)}</button><div class="bt"><div class="n">${sjTag(t)}${esc(t.title)}</div>${rng?`<div class="sub">bis ${fmt(t.date_to,{day:'numeric',month:'numeric'})}</div>`:''}</div>${warn?`<span class="wr">${I('warn',22)}</span>`:''}</div>`;
};
const dayHead=(k,plus)=>`<div class="dh"><div class="dl"><span class="dd">${wdShort(k)}, ${dmy(k)}</span>${k===TODAY?'<span class="tp">Heute</span>':''}</div>${plus?`<button class="ib sm" data-n="${k}" aria-label="Aufgabe hinzufügen">${I('plus',18)}</button>`:''}</div>`;
const fltBar=()=>`<div class="sg">${[['all','Alle'],['due','Fällig'],['plan','Plan']].map(([k,l])=>`<button data-f="${k}" class="${flt===k?'on':''}">${l}</button>`).join('')}</div>`;
const weekWin=()=>{const dow=(new Date().getDay()+6)%7,next=dow>=5;return{next,end:iso(addDays(monOf(TODAY),next?13:6))}};
const examCard=t=>{const dd=Math.max(0,Math.round((D(t.date)-D(TODAY))/864e5)),cd=dd===0?'Heute':dd===1?'Morgen':'in '+dd+' Tagen',d0=dd===0?TODAY:t.date;
  return `<div class="xc" data-e="${t.id}" style="--c:${esc(clr(t))}"><div class="xd"><span>${wdShort(d0)}</span><b>${D(d0).getDate()}</b></div><div class="xt">${sjTag(t)}${esc(t.title)}</div><div class="xcd">${cd}</div></div>`};

function home(){
  const td=TASKS.filter(t=>onDay(t,TODAY)),dn=td.filter(t=>t.done).length,pct=td.length?Math.round(dn/td.length*100):0;
  const win=weekWin(),inWin=t=>!t.done&&endOf(t)>=TODAY&&t.date<=win.end;
  const ex=TASKS.filter(t=>isExam(t)&&inWin(t)).sort(cmpD),ab=TASKS.filter(t=>isDue(t)&&!isExam(t)&&inWin(t)).sort(cmpD);
  const od=TASKS.filter(t=>!t.done&&endOf(t)<TODAY).length;
  const wk=win.next?'nächste Woche':'diese Woche';
  const nx=td.filter(t=>!t.done).sort(cmp),h=new Date().getHours(),g=h<11?'Guten Morgen':h<18?'Hallo':'Guten Abend';
  const nm=(PROFILE&&PROFILE.name)||'';
  return `<div class="card"><div class="big">${g}${nm?', '+esc(nm):''}</div><div class="mut">${fmt(TODAY,{weekday:'long',day:'numeric',month:'long'})}</div></div>
  <div class="card"><div class="mut" style="font-weight:600;text-transform:uppercase;letter-spacing:.05em">Heute</div><div style="margin-top:6px">${dn} von ${td.length} erledigt</div><div class="bar"><div style="width:${pct}%"></div></div>${od?`<p class="mut" style="margin-bottom:0">${od} überfällige Aufgabe${od>1?'n':''}</p>`:''}</div>
  <div class="sec">Heute offen</div>${nx.map(box).join('')||'<div class="empty">Heute ist nichts mehr offen.</div>'}
  <div class="sec">Prüfungen ${wk}</div>${ex.length?`<div class="xs">${ex.map(examCard).join('')}</div>`:`<div class="empty">Keine Prüfungen ${wk}.</div>`}
  <div class="sec">Abgaben ${wk}</div>${ab.map(box).join('')||`<div class="empty">Keine Abgaben ${wk}.</div>`}`;
}
function cal(){
  const mon=monOf(sel),sun=addDays(mon,6);
  const lab=mon.toLocaleDateString('de-CH',{day:'numeric',month:'short'})+' – '+sun.toLocaleDateString('de-CH',{day:'numeric',month:'short'});
  let h=`<div class="seg"><button data-v="day" class="${cv==='day'?'on':''}">Tag</button><button data-v="week" class="${cv==='week'?'on':''}">Woche</button></div>
  <div class="row" style="justify-content:space-between;margin-bottom:10px"><button class="ib" data-w="-7" aria-label="Zurück">${I('l')}</button><b>${lab}</b><div class="row"><button class="tdb${mon.getTime()===monOf(TODAY).getTime()&&(cv==='week'||sel===TODAY)?' cur':''}" data-today>Heute</button><button class="ib" data-w="7" aria-label="Weiter">${I('r')}</button></div></div>${fltBar()}`;
  const dayList=k=>TASKS.filter(t=>fl(t)&&onDay(t,k)).sort(cmp);
  if(cv==='week'){
    h+='<div class="wgrid">';
    for(let i=0;i<7;i++){const k=iso(addDays(mon,i)),l=dayList(k);
      h+='<div class="wcol">'+dayHead(k,true)+(l.map(box).join('')||'<div class="empty">Nichts geplant</div>')+'</div>'}
    h+='</div>';
  }else{
    h+='<div class="strip">';
    for(let i=0;i<7;i++){const d=addDays(mon,i),k=iso(d);h+=`<button class="wd${k===sel?' sel':''}${k===TODAY?' today':''}" data-d="${k}">${fmt(k,{weekday:'narrow'})}<b>${d.getDate()}</b></button>`}
    const l=dayList(sel);
    h+=`</div>${dayHead(sel,false)}${l.map(box).join('')||'<div class="empty">Nichts geplant. Tippe auf +, um etwas hinzuzufügen.</div>'}`;
  }
  return h;
}
function tasksView(){
  const grouped=list=>{let last='',h='';list.forEach(t=>{if(t.date!==last){last=t.date;h+=dayHead(t.date,false)}h+=box(t)});return h};
  const op=TASKS.filter(t=>!t.done&&fl(t)).sort(cmpD),dn=TASKS.filter(t=>t.done&&fl(t)).sort((a,b)=>b.date.localeCompare(a.date)||cmp(a,b));
  return `${fltBar()}<div class="sec" style="margin-top:6px">Offen (${op.length})</div>${grouped(op)||'<div class="empty">Nichts offen.</div>'}${dn.length?`<div class="sec">Erledigt (${dn.length})</div>${grouped(dn)}`:''}`;
}

  <label style="display:flex;gap:8px;align-items:center;color:var(--tx);font-size:15px"><input type="checkbox" id="aa" style="width:20px;height:20px"> Admin-Rechte</label>
  <button class="p ic" id="aadd" style="width:100%;margin-top:14px">${I('plus',18)} Benutzer anlegen</button></div>

function render(){
  applyTheme();
  const logged=!!U,cfg=SUPABASE_URL.includes('DEIN-PROJEKT');
  ['hd','nav','fab'].forEach(i=>$(i).style.display=logged?'':'none');
  if(!logged){$('main').innerHTML=cfg?setupView():loginView();if(!cfg)bindLogin();return}
  const admin=PROFILE&&PROFILE.is_admin;
  const TABS=[['home','home','Start'],['cal','cal','Kalender'],['tasks','list','Aufgaben']];
  if(admin)TABS.push(['admin','users','Admin']);
  if(tab==='admin'&&!admin)tab='home';
  $('ttl').textContent={home:'Start',cal:'Kalender',tasks:'Aufgaben',admin:'Admin',set:'Einstellungen'}[tab];
  const wide=tab==='cal'&&cv==='week';$('main').classList.toggle('wide',wide);$('hd').classList.toggle('wide',wide);
  $('main').innerHTML={home,cal,tasks:tasksView,admin:adminView,set:settingsView}[tab]();
  $('nav').innerHTML=TABS.map(t=>`<button class="${tab===t[0]?'on':''}" data-t="${t[0]}">${I(t[1],24)}${t[2]}</button>`).join('');
  $('fab').style.display=(tab==='set'||tab==='admin')?'none':'';
  $('fab').innerHTML=I('plus',30);
  $('gear').innerHTML=I(tab==='set'?'x':'gear',22);
  bind();
  if(tab==='admin'&&!USERS)loadUsers();
}
async function loadUsers(){
  try{USERS=(await callFn('admin-users',{action:'list'})).users;render()}catch(e){USERS=null;toast('Benutzer konnten nicht geladen werden: '+e.message)}
}

function bindLogin(){
  const go=async()=>{
    const b=$('li'),err=$('lerr');err.textContent='';b.disabled=true;
    const {data,error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
    if(error){err.textContent='E-Mail oder Passwort stimmt nicht.';b.disabled=false;return}
    U=data.user;err.textContent='';
    try{await loadAll()}catch(e){toast('Laden fehlgeschlagen')}
    tab='home';render();checkAnn();
  };
  $('li').onclick=go;$('pw').onkeydown=e=>{if(e.key==='Enter')go()};
}
function bind(){
  const m=$('main'),q=(s,f)=>m.querySelectorAll(s).forEach(f);
  const find=id=>TASKS.find(x=>x.id===id);
  q('[data-c]',b=>b.onclick=async e=>{e.stopPropagation();const t=find(b.dataset.c);const nv=!t.done;t.done=nv;render();try{await updTask(t,{done:nv})}catch(err){t.done=!nv;render();toast('Speichern fehlgeschlagen')}});
  q('[data-e]',b=>b.onclick=()=>sheet('edit',find(b.dataset.e)));
  q('[data-d]',b=>b.onclick=()=>{sel=b.dataset.d;render()});
  q('[data-v]',b=>b.onclick=()=>{cv=b.dataset.v;render()});
  q('[data-f]',b=>b.onclick=()=>{flt=b.dataset.f;render()});
  q('[data-n]',b=>b.onclick=()=>{sel=b.dataset.n;sheet('new')});
  q('[data-today]',b=>b.onclick=()=>{sel=TODAY;render()});
  q('[data-w]',b=>b.onclick=()=>{sel=iso(addDays(D(sel),+b.dataset.w));render()});
  if(tab==='set'){
    q('#sth button',b=>b.onclick=()=>{SET.theme=b.dataset.th;saveSet();render()});
    q('#sacc i',i=>i.onclick=()=>{SET.accent=i.dataset.k;saveSet();render()});
    $('saccx').onchange=e=>{SET.accent=e.target.value;saveSet();render()};
    if($('pwopen'))$('pwopen').onclick=()=>{pwOpen=true;render();$('pw0').focus()};
    if($('pwx'))$('pwx').onclick=()=>{pwOpen=false;render()};
    if($('pwsave'))$('pwsave').onclick=async e=>{
      const btn=e.currentTarget,msg=$('pwmsg'),p0=$('pw0').value,p1=$('pw1').value,p2=$('pw2').value;
      const bad=t=>{msg.style.color='#e5484d';msg.textContent=t};
      if(!p0)return bad('Bitte dein aktuelles Passwort eingeben.');
      if(p1.length<8)return bad('Das neue Passwort braucht mindestens 8 Zeichen.');
      if(p1!==p2)return bad('Die beiden neuen Passwörter stimmen nicht überein.');
      if(p1===p0)return bad('Das neue Passwort muss anders sein als das alte.');
      btn.disabled=true;msg.style.color='';msg.textContent='Speichere …';
      const chk=await sb.auth.signInWithPassword({email:U.email,password:p0});
      if(chk.error){btn.disabled=false;return bad('Das aktuelle Passwort stimmt nicht.')}
      const {error}=await sb.auth.updateUser({password:p1});
      btn.disabled=false;
      if(error)return bad('Das hat nicht geklappt: '+error.message);
      pwOpen=false;render();toast('Passwort geändert');
    };
    $('subjopen').onclick=subjSheet;

/* ---------- Dateien lesen (PDF, Word, Text) ---------- */
const LIB={pdf:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js',pdfw:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js',docx:'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js'};
const loaded={};
const load=k=>loaded[k]||(loaded[k]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=LIB[k];s.onload=res;s.onerror=()=>rej(new Error('load'));document.head.appendChild(s)}));
async function readFile(f){
  const n=f.name.toLowerCase();
  if(n.endsWith('.pdf')){
    await load('pdf');
    pdfjsLib.GlobalWorkerOptions.workerSrc=LIB.pdfw;
    const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;
    let out='';
    for(let p=1;p<=Math.min(pdf.numPages,80);p++){const c=await(await pdf.getPage(p)).getTextContent();out+=c.items.map(i=>i.str).join(' ')+'\n';if(out.length>60000)break}
    if(out.trim().length<20)throw new Error('empty');
    return out;
  }
  if(n.endsWith('.docx')){await load('docx');return(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value}
  if(n.endsWith('.doc'))throw new Error('doc');
  return f.text();
}

function review(o){
  const on=o.items.map(()=>true);
  const bg=document.createElement('div');bg.className='sheetbg';bg.style.zIndex=30;
  const order=o.items.map((_,i)=>i).sort((a,b)=>o.items[a].date.localeCompare(o.items[b].date)||a-b);
  let last='',list='';
  order.forEach(i=>{const t=o.items[i];

    list+=`<label class="ri${o.danger?' dng':''}" style="--c:${esc(clr(t))}"><input type="checkbox" data-i="${i}" checked><div><div class="n">${kindChip(t)}${sjTag(t)}${esc(t.title)}</div>${t.details?`<div class="rdt">${esc(t.details)}</div>`:''}</div></label>`});
  bg.innerHTML=`<div class="sheet rv"><div class="row" style="justify-content:space-between;margin-bottom:4px"><h3>${esc(o.title)}</h3><button class="ib sm" id="rx" aria-label="Schliessen">${I('x',18)}</button></div>
    <div class="mut" style="margin-bottom:8px">${esc(o.sub)}</div>
    <div style="margin-bottom:4px"><button id="rall" style="padding:6px 12px;font-size:13px"></button></div>
    <div class="rl">${list}</div>
    <div class="rf"><button id="rno">Abbrechen</button><button id="rok" class="${o.danger?'red':'p'}"></button></div></div>`;
  const ok=bg.querySelector('#rok'),all=bg.querySelector('#rall'),boxes=[...bg.querySelectorAll('.ri input')];
  const sync=()=>{
    const n=on.filter(Boolean).length;
    ok.textContent=o.ok+(n?' ('+n+')':'');ok.disabled=!n;
    all.textContent=n===on.length?'Alle abwählen':'Alle auswählen';
    boxes.forEach(c=>c.closest('.ri').classList.toggle('off',!on[+c.dataset.i]));
  };
  boxes.forEach(c=>c.onchange=()=>{on[+c.dataset.i]=c.checked;sync()});
  all.onclick=()=>{const v=on.filter(Boolean).length!==on.length;on.fill(v);boxes.forEach(c=>c.checked=v);sync()};
  const cancel=()=>bg.remove();
  bg.querySelector('#rx').onclick=cancel;bg.querySelector('#rno').onclick=cancel;
  ok.onclick=async()=>{
    ok.disabled=true;ok.textContent='Bitte warten …';
    try{await o.onOk(o.items.filter((_,i)=>on[i]));bg.remove()}
    catch(err){toast('Das hat nicht geklappt: '+(err&&err.message||err));sync()}
  };
  document.body.appendChild(bg);sync();
}

/* ---------- Formular: Aufgabe anlegen / bearbeiten ---------- */
function fromGroup(grp,t){
  const d=grp.find(isDue),pl=grp.filter(x=>!isDue(x)).sort((a,b)=>a.date.localeCompare(b.date));
  return {title:t.title,details:t.details||'',subject:t.subject||'',urgent:!!t.urgent,
    due:d?{on:true,from:d.date,to:d.date_to||'',type:d.ttype||'',color:d.color}:{on:false,from:t.date,to:'',type:'',color:PAL[0]},
    plan:pl.length?{on:true,days:pl.map(x=>x.date),type:pl[0].ttype||'',color:pl[0].color}:{on:false,days:[t.date],type:'',color:PAL[1]}};
}
async function saveForm(f,grp,days){
  const gid=(grp[0]&&grp[0].group_id)||uuid();
  const base={title:f.title.trim(),details:f.details.trim(),urgent:f.urgent,group_id:gid};
  if(HAS_SUBJ)base.subject=f.subject||'';
  const dueRow=grp.find(isDue),planRows=grp.filter(x=>!isDue(x));
  const ins=[],upd=[],del=[];
  if(f.due.on){
    const to=f.due.to&&f.due.to>f.due.from?f.due.to:null;
    const row={...base,kind:'due',ttype:f.due.type,color:f.due.color,date:f.due.from,date_to:to};
    dueRow?upd.push([dueRow,row]):ins.push({...row,done:false});
  }else if(dueRow)del.push(dueRow);
  if(f.plan.on){
    days.forEach(d=>{
      const row={...base,kind:'plan',ttype:f.plan.type,color:f.plan.color,date:d,date_to:null};
      const ex=planRows.find(x=>x.date===d);ex?upd.push([ex,row]):ins.push({...row,done:false});
    });
    planRows.forEach(x=>{if(!days.includes(x.date))del.push(x)});
  }else del.push(...planRows);
  for(const [x,row] of upd)await updTask(x,row);
  if(ins.length)await addTasks(ins);
  if(del.length)await delIds(del.map(x=>x.id));
  const dates=[...upd.map(u=>u[1]),...ins].map(x=>x.date).sort();
  if(dates[0])sel=dates[0];
}

      ${f.plan.type===''?`<label>Farbe</label>${swt('pc',f.plan.color,'p_cx')}`:''}`:''}</div>
    <label class="ck"><input type="checkbox" id="urg" ${f.urgent?'checked':''}><span>Dringlich <span class="mut">(steht weiter oben)</span></span></label>
    ${edit?`<button class="ic" id="help" style="width:100%;margin-top:16px">${I('spark',18)} KI-Hilfe zu dieser Aufgabe</button><div class="ai" id="hout" ${t.note?'':'hidden'}>${esc(t.note||'')}</div>
    <button class="red ic" id="del" style="width:100%;margin-top:16px">${I('trash',18)} Aufgabe löschen</button>`:''}`;
  const delHtml=()=>`<label style="margin-top:0">Was soll die KI löschen?</label><textarea id="f_q" style="min-height:120px" placeholder="z. B. Lösche alle Mathe-Kapitel-Aufgaben&#10;oder: Lösche alles zwischen dem 10. und 15. November">${esc(dprompt)}</textarea>

    <label>Dateien anhängen (PDF, Word .docx, .txt, .md, .csv)</label><input type="file" id="f_f" accept=".pdf,.docx,.txt,.md,.csv,.json,text/*" multiple hidden>
    <button class="p ic" id="pick">${I('clip',18)} Datei hinzufügen</button>

          const r=await callFn('ai',{mode:'delete',prompt:dprompt,today:TODAY});
          btn.disabled=false;
          if(!r.tasks.length){am.textContent='Keine passenden Aufgaben gefunden. Beschreibe es genauer, z. B. mit Fach oder Zeitraum.';return}
          am.textContent=dst;
          review({title:'Diese Aufgaben löschen?',sub:r.tasks.length+' gefunden. Entferne das Häkchen bei allem, was bleiben soll.',items:r.tasks,ok:'Löschen',danger:true,
            onOk:async items=>{await delIds(items.map(x=>x.id));close();render();toast(nA(items.length)+' gelöscht')}});
        }catch(err){am.textContent='Das hat nicht geklappt: '+err.message;btn.disabled=false}
      };
    }else{
      const fi=g('f_f');
      g('pick').onclick=()=>fi.click();
      fi.onchange=async e=>{
        grab();const list=[...e.target.files],am=g('amsg');st=AIMSG;
        for(const x of list){
          if(x.size>15e6){st=x.name+' ist zu gross (max. 15 MB).';continue}
          am.textContent='Lese '+x.name+' …';
          try{files.push({name:x.name,text:await readFile(x)})}
          catch(err){const c=err.message;st=c==='doc'?'Altes .doc wird nicht unterstützt. Bitte als .docx speichern.':c==='empty'?x.name+': kein Text gefunden (gescanntes PDF?).':'Datei konnte nicht gelesen werden: '+x.name}
        }
        draw()};
      qa('[data-r]',b=>b.onclick=()=>{grab();files.splice(+b.dataset.r,1);draw()});
      g('go').onclick=async e=>{
        grab();const am=g('amsg'),btn=e.currentTarget;
        if(!prompt.trim()&&!files.length){am.textContent='Bitte Text eingeben oder eine Datei anhängen.';return}
        btn.disabled=true;am.textContent='KI arbeitet … bei einem ganzen Monatsplan kann das eine Minute dauern.';
        try{
          const material=files.map(x=>`### ${x.name}\n${x.text}`).join('\n\n');
          const r=await callFn('ai',{mode:'plan',prompt,material,today:TODAY,subjects:HAS_SUBJ?SUBJ.map(x=>x[0]):[]});
          // importance 2 = Prüfung (fällig), 1 = Abgabe/Frist (fällig), 0 = normale Aufgabe (Plan)
          // Fach: Auswahl von Hand gilt für alle, sonst das Fach, das die KI erkannt hat (dann auch dessen Farbe)
          const rows=r.tasks.map(x=>{const im=x.importance||0,sj=HAS_SUBJ?(aiSubj||(SUBJ.some(v=>v[0]===x.subject)?x.subject:'')):'';
            return {title:x.title,details:x.details||'',date:x.date,date_to:null,kind:im>=1?'due':'plan',ttype:im===2?'exam':'',urgent:false,color:(!aiSubj&&sj)?sjColor(sj):aiColor,...(sj?{subject:sj}:{})}});
          btn.disabled=false;am.textContent='Prüfe die Liste und tippe auf «Übernehmen».';
          review({title:'Neue Aufgaben prüfen',sub:rows.length+' Aufgaben vorgeschlagen. Noch ist nichts gespeichert. Entferne das Häkchen bei allem, was du nicht möchtest.',items:rows,ok:'Übernehmen',
            onOk:async items=>{
              await addTasks(items.map(x=>({...x,done:false,group_id:null})));
              const first=items.map(x=>x.date).sort()[0];
              sel=first&&first>=TODAY?first:TODAY;tab='cal';cv='week';
              close();render();toast(nA(items.length)+' übernommen');
            }});
        }catch(err){am.textContent='Das hat nicht geklappt: '+err.message;btn.disabled=false}
      };
    }
  }
  document.body.appendChild(bg);draw();
}

/* ---------- Start ---------- */
(async function boot(){
  applyTheme();
  if(SUPABASE_URL.includes('DEIN-PROJEKT')){render();return}
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'){U=null;PROFILE=null;TASKS=[];USERS=null;ANN=[];render()}});
  const {data}=await sb.auth.getSession();
  if(data.session){U=data.session.user;try{await loadAll()}catch(e){toast('Laden fehlgeschlagen')}}
  render();
  if(U)checkAnn();
})();
</script>
