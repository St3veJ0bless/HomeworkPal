<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lernplaner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#3b5bdb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lernplaner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#f4f3ef;--card:#fff;--tx:#1d1d1b;--mut:#77756e;--bd:#e4e2da;--ac:#3b5bdb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121215;--card:#1f1f24;--tx:#efeee9;--mut:#9a98a0;--bd:#33333a}}
:root[data-theme="dark"]{--bg:#121215;--card:#1f1f24;--tx:#efeee9;--mut:#9a98a0;--bd:#33333a}
html{height:100%;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
svg{display:block}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 6px;max-width:640px;width:100%;margin:0 auto}
h1{font-size:26px;margin:0}
main{flex:1;overflow-y:auto;padding:8px 16px 130px;max-width:640px;width:100%;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--ac);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;max-width:160px;border:0;background:none;color:#fff;opacity:.65;padding:6px 0;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:14px}
nav button.on{opacity:1;background:rgba(255,255,255,.2)}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 14px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
button.ib{width:40px;height:40px;padding:0;border-radius:50%;background:var(--ac);color:#fff;border:0;display:grid;place-items:center;flex:none}
button.ib.sm{width:32px;height:32px}
button.ic{display:flex;align-items:center;justify-content:center;gap:8px}
button.red{background:#e5484d;color:#fff;border-color:#e5484d}
button:disabled{opacity:.5}
.fab{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;padding:0;background:var(--ac);color:#fff;border:0;box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:6;display:grid;place-items:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:14px}
.mut{color:var(--mut);font-size:14px}
.sec{margin:18px 2px 8px;text-transform:uppercase;letter-spacing:.05em;font-size:14px;color:var(--mut);font-weight:600}
.row{display:flex;gap:8px;align-items:center}
.box{display:flex;align-items:center;gap:12px;min-height:60px;height:auto;padding:14px 14px 14px 16px;border-radius:16px;border-left:6px solid var(--c);background:color-mix(in srgb,var(--c) 20%,var(--card));margin-bottom:10px;cursor:pointer}
.box .bt{flex:1;min-width:0}
.box .n{font-size:16px;font-weight:600;line-height:1.35;overflow-wrap:anywhere;white-space:normal}
.box .dt{font-size:14px;opacity:.85;margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.box .mut{font-size:13px;margin-top:2px}
.box.done .n,.box.done .dt{text-decoration:line-through;opacity:.55}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--c);background:none;color:transparent;padding:0;display:grid;place-items:center;flex:none}
.box.done .chk{background:var(--c);color:#fff}
.imp{color:#e5484d;font-weight:800}
.dh{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px;font-weight:700}
.dh.today span{color:var(--ac)}
.empty{border:2px dashed var(--bd);border-radius:18px;padding:18px;text-align:center;color:var(--mut);font-size:14px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.wd{border:0;background:none;padding:4px 0;border-radius:12px;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--mut)}
.wd b{font-size:16px;color:var(--tx);width:34px;height:34px;line-height:34px;border-radius:50%}
.wd.today b{color:var(--ac)}
.wd.sel b{background:var(--ac);color:#fff}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0;font-size:20px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input[type=text],input[type=email],input[type=password],input[type=date],textarea,select{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
textarea{min-height:110px;resize:vertical}
.sw{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw i{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent;outline:1px solid var(--bd)}
.sw i.on{border-color:var(--bg);outline:2px solid var(--tx)}
.sw input{width:38px;height:38px;padding:0;border:0;background:none}
.ai{white-space:pre-wrap;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:10px;font-size:14px}
.big{font-size:28px;font-weight:700}
.bar{height:10px;border-radius:5px;background:var(--bd);overflow:hidden;margin-top:8px}
.bar div{height:100%;background:var(--ac)}
.file{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;padding:8px 10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;font-size:14px}
.login{max-width:380px;margin:12vh auto 0}
.login h1{text-align:center;margin-bottom:6px}
.user{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.user:first-of-type{border-top:0}
.user .u{flex:1;min-width:0;overflow-wrap:anywhere}
.badge{font-size:11px;background:var(--ac);color:#fff;border-radius:8px;padding:2px 6px;margin-left:6px;vertical-align:middle}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:#222;color:#fff;padding:10px 16px;border-radius:12px;z-index:50;max-width:88%;font-size:14px;text-align:center}
</style>
</head>
<body>
<header id="hd"><h1 id="ttl"></h1><button class="ib" id="gear" aria-label="Einstellungen"></button></header>
<main id="main"></main>
<button class="fab" id="fab" aria-label="Hinzufügen"></button>
<nav id="nav"></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ====== HIER EINTRAGEN (siehe README, Schritt 5) ====== */
const SUPABASE_URL = 'https://DEIN-PROJEKT.supabase.co';
const SUPABASE_ANON_KEY = 'DEIN-ANON-KEY';
/* ======================================================= */

const COL=['#e5484d','#f76b15','#f5b800','#30a46c','#0091ff','#3b5bdb','#8e4ec6','#e93d82'];
const P={home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',list:'<path d="M10 6h11M10 12h11M10 18h11"/><path d="M3 6l1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>',plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',clip:'<path d="M21 11l-9 9a5 5 0 01-7-7l9-9a3.5 3.5 0 015 5l-9 9a2 2 0 01-3-3l8-8"/>',spark:'<path d="M11 3l1.8 5.2L18 10l-5.2 1.8L11 17l-1.8-5.2L4 10l5.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>',pen:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',l:'<path d="M15 5l-7 7 7 7"/>',r:'<path d="M9 5l7 7-7 7"/>',file:'<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/>',check:'<path d="M5 12.5l4.5 4.5L19 7"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',moon:'<path d="M21 13A9 9 0 1111 3a7 7 0 0010 10z"/>',auto:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-4 3.5-6 6.5-6s6 2 6.5 6"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14c2 .7 3.3 2.7 3.5 6"/>',logout:'<path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/>',key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>'};
const I=(n,s=22)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

const $=i=>document.getElementById(i);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const D=s=>new Date(s+'T12:00'),fmt=(s,o)=>D(s).toLocaleDateString('de-CH',o);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const TODAY=iso(new Date());

/* ---------- Zustand ---------- */
let sb=null,U=null,PROFILE=null,TASKS=[],USERS=null;
let tab='home',prev='home',sel=TODAY,cv='week';
const LS='lernplaner-set';
let SET={accent:'#3b5bdb',theme:'auto'};
try{Object.assign(SET,JSON.parse(localStorage.getItem(LS)||'{}'))}catch(e){}
const saveSet=()=>{try{localStorage.setItem(LS,JSON.stringify(SET))}catch(e){}};

function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}
function applyTheme(){const r=document.documentElement;SET.theme==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',SET.theme);r.style.setProperty('--ac',SET.accent)}

async function callFn(name,body){
  const {data,error}=await sb.functions.invoke(name,{body});
  if(error){let m=error.message;try{const j=await error.context.json();if(j&&j.error)m=j.error}catch(e){}throw new Error(m)}
  if(data&&data.error)throw new Error(data.error);
  return data;
}

/* ---------- Daten laden / speichern ---------- */
async function loadAll(){
  const [p,t]=await Promise.all([
    sb.from('profiles').select('*').eq('id',U.id).maybeSingle(),
    sb.from('tasks').select('*').order('date')
  ]);
  PROFILE=p.data||{name:'',email:U.email,is_admin:false};
  TASKS=t.data||[];
  // Aufräumen: Aufgaben, die älter als 30 Tage sind, löschen
  const lim=iso(addDays(new Date(),-30)),old=TASKS.filter(x=>x.date<lim);
  if(old.length){await sb.from('tasks').delete().in('id',old.map(x=>x.id));TASKS=TASKS.filter(x=>x.date>=lim)}
}
async function addTasks(rows){
  const {data,error}=await sb.from('tasks').insert(rows).select();
  if(error)throw error;TASKS.push(...data);return data;
}
async function updTask(t,patch){
  const {error}=await sb.from('tasks').update(patch).eq('id',t.id);
  if(error)throw error;Object.assign(t,patch);
}
async function delTask(t){
  const {error}=await sb.from('tasks').delete().eq('id',t.id);
  if(error)throw error;TASKS=TASKS.filter(x=>x.id!==t.id);
}

/* ---------- Ansichten ---------- */
const impS=n=>n?'<span class="imp">'+'!'.repeat(n)+'</span> ':'';
const byDate=(a,b)=>a.date.localeCompare(b.date)||b.imp-a.imp;
const box=(t,sd=true)=>`<div class="box${t.done?' done':''}" data-e="${t.id}" style="--c:${esc(t.color)}"><div class="bt"><div class="n">${impS(t.imp)}${esc(t.title)}</div>${t.details?`<div class="dt">${esc(t.details)}</div>`:''}${sd?`<div class="mut">${t.date===TODAY?'Heute':fmt(t.date,{weekday:'short',day:'numeric',month:'short'})}</div>`:''}</div><button class="chk" data-c="${t.id}" aria-label="Erledigt">${I('check',18)}</button></div>`;
const monOf=s=>{const d=D(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return d};

function loginView(){
  return `<div class="login"><h1>Lernplaner</h1><p class="mut" style="text-align:center;margin-top:0">Bitte melde dich an.</p>
  <div class="card"><label style="margin-top:0">E-Mail</label><input type="email" id="em" autocomplete="username" autocapitalize="off">
  <label>Passwort</label><input type="password" id="pw" autocomplete="current-password">
  <button class="p" id="li" style="width:100%;margin-top:16px">Anmelden</button><div class="mut" id="lerr" style="margin-top:10px;color:#e5484d"></div></div>
  <p class="mut" style="text-align:center">Kein Konto? Dein Admin legt es für dich an.</p></div>`;
}
function setupView(){
  return `<div class="login"><h1>Einrichtung fehlt</h1><div class="card"><p>Trage in <b>index.html</b> ganz oben deine <b>SUPABASE_URL</b> und den <b>SUPABASE_ANON_KEY</b> ein. Die Anleitung steht in der README, Schritt 5.</p></div></div>`;
}
function home(){
  const td=TASKS.filter(t=>t.date===TODAY),dn=td.filter(t=>t.done).length,pct=td.length?Math.round(dn/td.length*100):0;
  const hi=TASKS.filter(t=>!t.done&&t.imp>0&&t.date>=TODAY).sort(byDate).slice(0,5),od=TASKS.filter(t=>!t.done&&t.date<TODAY).length;
  const nx=td.filter(t=>!t.done).sort(byDate),h=new Date().getHours(),g=h<11?'Guten Morgen':h<18?'Hallo':'Guten Abend';
  const nm=(PROFILE&&PROFILE.name)||'';
  return `<div class="card"><div class="big">${g}${nm?', '+esc(nm):''}</div><div class="mut">${fmt(TODAY,{weekday:'long',day:'numeric',month:'long'})}</div></div>
  <div class="card"><div class="mut" style="font-weight:600;text-transform:uppercase;letter-spacing:.05em">Heute</div><div style="margin-top:6px">${dn} von ${td.length} erledigt</div><div class="bar"><div style="width:${pct}%"></div></div>${od?`<p class="mut" style="margin-bottom:0">${od} überfällige Aufgabe${od>1?'n':''}</p>`:''}</div>
  <div class="sec">Heute offen</div>${nx.map(t=>box(t,false)).join('')||'<div class="empty">Heute ist nichts mehr offen.</div>'}
  <div class="sec">Wichtig</div>${hi.map(t=>box(t)).join('')||'<div class="empty">Keine wichtigen offenen Aufgaben.</div>'}`;
}
function cal(){
  const mon=monOf(sel),sun=addDays(mon,6);
  const lab=mon.toLocaleDateString('de-CH',{day:'numeric',month:'short'})+' – '+sun.toLocaleDateString('de-CH',{day:'numeric',month:'short'});
  let h=`<div class="seg"><button data-v="week" class="${cv==='week'?'on':''}">Woche</button><button data-v="day" class="${cv==='day'?'on':''}">Tag</button></div>
  <div class="row" style="justify-content:space-between;margin-bottom:6px"><button class="ib" data-w="-7" aria-label="Zurück">${I('l')}</button><b>${lab}</b><button class="ib" data-w="7" aria-label="Weiter">${I('r')}</button></div>`;
  if(cv==='week'){
    for(let i=0;i<7;i++){const k=iso(addDays(mon,i)),l=TASKS.filter(t=>t.date===k).sort(byDate);
      h+=`<div class="dh${k===TODAY?' today':''}"><span>${fmt(k,{weekday:'long',day:'numeric',month:'long'})}</span><button class="ib sm" data-n="${k}" aria-label="Aufgabe hinzufügen">${I('plus',18)}</button></div>${l.map(t=>box(t,false)).join('')||'<div class="empty">Nichts geplant</div>'}`}
  }else{
    h+='<div class="strip">';
    for(let i=0;i<7;i++){const d=addDays(mon,i),k=iso(d);h+=`<button class="wd${k===sel?' sel':''}${k===TODAY?' today':''}" data-d="${k}">${fmt(k,{weekday:'narrow'})}<b>${d.getDate()}</b></button>`}
    const l=TASKS.filter(t=>t.date===sel).sort(byDate);
    h+=`</div><div class="dh"><span>${fmt(sel,{weekday:'long',day:'numeric',month:'long'})}</span></div>${l.map(t=>box(t,false)).join('')||'<div class="empty">Nichts geplant. Tippe auf +, um etwas hinzuzufügen.</div>'}`;
  }
  return h;
}
function tasksView(){
  const op=TASKS.filter(t=>!t.done).sort(byDate),dn=TASKS.filter(t=>t.done).sort(byDate).reverse();
  return `<div class="sec" style="margin-top:6px">Offen (${op.length})</div>${op.map(t=>box(t)).join('')||'<div class="empty">Nichts offen.</div>'}${dn.length?`<div class="sec">Erledigt (${dn.length})</div>${dn.map(t=>box(t)).join('')}`:''}`;
}
function adminView(){
  const list=USERS?USERS.map(u=>`<div class="user"><div class="u"><b>${esc(u.name||u.email)}</b>${u.is_admin?'<span class="badge">Admin</span>':''}<div class="mut">${esc(u.email)}</div></div><button class="ib sm" data-pw="${u.id}" aria-label="Passwort setzen">${I('key',16)}</button>${u.id===U.id?'':`<button class="ib sm" style="background:#e5484d" data-du="${u.id}" aria-label="Löschen">${I('trash',16)}</button>`}</div>`).join(''):'<p class="mut">Lade …</p>';
  return `<div class="card"><b>Neuen Benutzer anlegen</b>
  <label>Name</label><input type="text" id="an" autocomplete="off">
  <label>E-Mail</label><input type="email" id="ae" autocomplete="off" autocapitalize="off">
  <label>Passwort (mind. 8 Zeichen)</label><input type="text" id="ap" autocomplete="off" autocapitalize="off">
  <label style="display:flex;gap:8px;align-items:center;color:var(--tx);font-size:15px"><input type="checkbox" id="aa" style="width:20px;height:20px"> Admin-Rechte</label>
  <button class="p ic" id="aadd" style="width:100%;margin-top:14px">${I('plus',18)} Benutzer anlegen</button></div>
  <div class="sec">Benutzer</div><div class="card">${list}</div>`;
}
function settingsView(){
  return `<div class="card"><div class="mut">Angemeldet als</div><div><b>${esc((PROFILE&&PROFILE.name)||'')}</b> ${esc(U.email)}</div>
  <label>Akzentfarbe</label><div class="sw" id="sacc">${COL.map(c=>`<i data-k="${c}" class="${c===SET.accent?'on':''}" style="background:${c}"></i>`).join('')}<input type="color" id="saccx" value="${SET.accent}"></div>
  <label>Design</label><div class="seg" id="sth">${[['light','sun','Hell'],['dark','moon','Dunkel'],['auto','auto','Auto']].map(o=>`<button class="ic ${SET.theme===o[0]?'on':''}" data-th="${o[0]}">${I(o[1],18)} ${o[2]}</button>`).join('')}</div></div>
  <div class="card"><button class="ic" id="logout" style="width:100%">${I('logout',18)} Abmelden</button></div>`;
}

function render(){
  applyTheme();
  const logged=!!U,cfg=SUPABASE_URL.includes('DEIN-PROJEKT');
  ['hd','nav','fab'].forEach(i=>$(i).style.display=logged?'':'none');
  if(!logged){$('main').innerHTML=cfg?setupView():loginView();if(!cfg)bindLogin();return}
  const admin=PROFILE&&PROFILE.is_admin;
  const TABS=[['home','home','Start'],['cal','cal','Kalender'],['tasks','list','Aufgaben']];
  if(admin)TABS.push(['admin','users','Admin']);
  if(tab==='admin'&&!admin)tab='home';
  $('ttl').textContent={home:'Start',cal:'Kalender',tasks:'Aufgaben',admin:'Admin',set:'Einstellungen'}[tab];
  $('main').innerHTML={home,cal,tasks:tasksView,admin:adminView,set:settingsView}[tab]();
  $('nav').innerHTML=TABS.map(t=>`<button class="${tab===t[0]?'on':''}" data-t="${t[0]}">${I(t[1],24)}${t[2]}</button>`).join('');
  $('fab').style.display=(tab==='set'||tab==='admin')?'none':'';
  $('fab').innerHTML=I('plus',30);
  $('gear').innerHTML=I(tab==='set'?'x':'gear',22);
  bind();
  if(tab==='admin'&&!USERS)loadUsers();
}
async function loadUsers(){
  try{USERS=(await callFn('admin-users',{action:'list'})).users;render()}catch(e){USERS=null;toast('Benutzer konnten nicht geladen werden: '+e.message)}
}

function bindLogin(){
  const go=async()=>{
    const b=$('li'),err=$('lerr');err.textContent='';b.disabled=true;
    const {data,error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
    if(error){err.textContent='E-Mail oder Passwort stimmt nicht.';b.disabled=false;return}
    U=data.user;err.textContent='';
    try{await loadAll()}catch(e){toast('Laden fehlgeschlagen')}
    tab='home';render();
  };
  $('li').onclick=go;$('pw').onkeydown=e=>{if(e.key==='Enter')go()};
}
function bind(){
  const m=$('main'),q=(s,f)=>m.querySelectorAll(s).forEach(f);
  const find=id=>TASKS.find(x=>x.id===id);
  q('[data-c]',b=>b.onclick=async e=>{e.stopPropagation();const t=find(b.dataset.c);const nv=!t.done;t.done=nv;render();try{await updTask(t,{done:nv})}catch(err){t.done=!nv;render();toast('Speichern fehlgeschlagen')}});
  q('[data-e]',b=>b.onclick=()=>sheet('edit',find(b.dataset.e)));
  q('[data-d]',b=>b.onclick=()=>{sel=b.dataset.d;render()});
  q('[data-v]',b=>b.onclick=()=>{cv=b.dataset.v;render()});
  q('[data-n]',b=>b.onclick=()=>{sel=b.dataset.n;sheet('new')});
  q('[data-w]',b=>b.onclick=()=>{sel=iso(addDays(D(sel),+b.dataset.w));render()});
  if(tab==='set'){
    q('#sth button',b=>b.onclick=()=>{SET.theme=b.dataset.th;saveSet();render()});
    q('#sacc i',i=>i.onclick=()=>{SET.accent=i.dataset.k;saveSet();render()});
    $('saccx').onchange=e=>{SET.accent=e.target.value;saveSet();render()};
    $('logout').onclick=async()=>{await sb.auth.signOut();U=null;PROFILE=null;TASKS=[];USERS=null;tab='home';render()};
  }
  if(tab==='admin'){
    $('aadd').onclick=async e=>{
      const b=e.currentTarget;b.disabled=true;
      try{await callFn('admin-users',{action:'create',name:$('an').value,email:$('ae').value,password:$('ap').value,is_admin:$('aa').checked});toast('Benutzer angelegt');USERS=null;render()}
      catch(err){toast(err.message);b.disabled=false}
    };
    q('[data-pw]',b=>b.onclick=async()=>{
      const pw=prompt('Neues Passwort (mind. 8 Zeichen):');if(!pw)return;
      try{await callFn('admin-users',{action:'setpw',id:b.dataset.pw,password:pw});toast('Passwort geändert')}catch(err){toast(err.message)}
    });
    q('[data-du]',b=>b.onclick=async()=>{
      const u=USERS.find(x=>x.id===b.dataset.du);
      if(!confirm('Benutzer '+(u.email)+' und alle seine Aufgaben wirklich löschen?'))return;
      try{await callFn('admin-users',{action:'delete',id:u.id});toast('Gelöscht');USERS=null;render()}catch(err){toast(err.message)}
    });
  }
}
$('nav').onclick=e=>{const b=e.target.closest('[data-t]');if(b){tab=b.dataset.t;if(tab==='admin')USERS=null;render()}};
$('gear').onclick=()=>{if(tab==='set')tab=prev;else{prev=tab;tab='set'}render()};
$('fab').onclick=()=>sheet('new');

/* ---------- Dateien lesen (PDF, Word, Text) ---------- */
const LIB={pdf:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js',pdfw:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js',docx:'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js'};
const loaded={};
const load=k=>loaded[k]||(loaded[k]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=LIB[k];s.onload=res;s.onerror=()=>rej(new Error('load'));document.head.appendChild(s)}));
async function readFile(f){
  const n=f.name.toLowerCase();
  if(n.endsWith('.pdf')){
    await load('pdf');
    pdfjsLib.GlobalWorkerOptions.workerSrc=LIB.pdfw;
    const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;
    let out='';
    for(let p=1;p<=Math.min(pdf.numPages,80);p++){const c=await(await pdf.getPage(p)).getTextContent();out+=c.items.map(i=>i.str).join(' ')+'\n';if(out.length>60000)break}
    if(out.trim().length<20)throw new Error('empty');
    return out;
  }
  if(n.endsWith('.docx')){await load('docx');return(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value}
  if(n.endsWith('.doc'))throw new Error('doc');
  return f.text();
}

/* ---------- Blatt: neue / bestehende Aufgabe ---------- */
function sheet(mode,t){
  const edit=mode==='edit';let m=edit?'manual':'ai';
  const dr=edit?{...t}:{title:'',details:'',date:sel,color:COL[5],imp:0};
  let files=[],prompt='',st='Du musst keinen Tag angeben. Die KI ordnet alles selbst den Tagen zu.';
  const bg=document.createElement('div');bg.className='sheetbg';
  const close=()=>bg.remove();bg.onclick=e=>{if(e.target===bg)close()};
  const sw=()=>`<label>Farbe</label><div class="sw">${COL.map(c=>`<i data-k="${c}" class="${c===dr.color?'on':''}" style="background:${c}"></i>`).join('')}<input type="color" value="${esc(dr.color)}" id="cx"></div>`;
  function draw(){
    const old=bg.querySelector('.sheet'),sc=old?old.scrollTop:0;
    bg.innerHTML=`<div class="sheet"><div class="row" style="justify-content:space-between;margin-bottom:12px"><h3>${edit?'Aufgabe bearbeiten':'Neu hinzufügen'}</h3><button class="ib sm" id="x" aria-label="Schliessen">${I('x',18)}</button></div>
    ${edit?'':`<div class="seg"><button class="ic ${m==='manual'?'on':''}" data-m="manual">${I('pen',18)} Selbst</button><button class="ic ${m==='ai'?'on':''}" data-m="ai">${I('spark',18)} Mit KI</button></div>`}
    ${m==='manual'?`<label style="margin-top:0">Titel</label><input type="text" id="f_t" value="${esc(dr.title)}" placeholder="z. B. Mathe Kapitel 3 lernen">
      <label>Details / Auftrag (optional)</label><textarea id="f_x" style="min-height:80px" placeholder="Was genau ist zu tun?">${esc(dr.details)}</textarea>
      <label>Tag</label><input type="date" id="f_d" value="${dr.date}">
      ${sw()}
      <label>Wichtigkeit</label><div class="seg" id="imp">${['Normal','! Wichtig','!! Sehr wichtig'].map((l,i)=>`<button data-i="${i}" class="${dr.imp===i?'on':''}">${l}</button>`).join('')}</div>
      <div class="row" style="margin-top:14px"><button class="p" id="ok" style="flex:1">Speichern</button>${edit?`<button class="red ic" id="del" aria-label="Löschen">${I('trash',18)}</button>`:''}</div>
      ${edit?`<button class="ic" id="help" style="width:100%;margin-top:10px">${I('spark',18)} KI-Hilfe zu dieser Aufgabe</button><div class="ai" id="hout" ${dr.note?'':'hidden'}>${esc(dr.note||'')}</div>`:''}`
    :`<label style="margin-top:0">Was soll die KI machen? Hier kannst du z. B. deinen Monatsplan einfügen.</label><textarea id="f_p" style="min-height:150px" placeholder="z. B. Mein Plan für November: Woche 1 Mathe Kapitel 1–2, Woche 2 Bio Zellbiologie, 20.11. Prüfung Mathe …">${esc(prompt)}</textarea>
      <label>Dateien anhängen (PDF, Word .docx, .txt, .md, .csv)</label><input type="file" id="f_f" accept=".pdf,.docx,.txt,.md,.csv,.json,text/*" multiple hidden>
      <button class="p ic" id="pick">${I('clip',18)} Datei hinzufügen</button>
      ${files.map((f,i)=>`<div class="file"><span style="display:flex;gap:8px;align-items:center;min-width:0">${I('file',18)}<span style="overflow-wrap:anywhere">${esc(f.name)}</span></span><button class="ib sm" data-r="${i}" aria-label="Entfernen">${I('x',16)}</button></div>`).join('')}
      ${sw()}
      <div class="row" style="margin-top:14px"><button class="p ic" id="go" style="flex:1">${I('spark',18)} Aufgaben erstellen</button></div><div class="mut" id="amsg" style="margin-top:8px">${esc(st)}</div>`}
    </div>`;
    const sh=bg.querySelector('.sheet');sh.scrollTop=sc;
    const g=i=>sh.querySelector('#'+i);
    const grab=()=>{if(g('f_t'))dr.title=g('f_t').value;if(g('f_x'))dr.details=g('f_x').value;if(g('f_d'))dr.date=g('f_d').value||dr.date;if(g('f_p'))prompt=g('f_p').value};
    g('x').onclick=close;
    sh.querySelectorAll('.sw i').forEach(i=>i.onclick=()=>{grab();dr.color=i.dataset.k;draw()});
    if(g('cx'))g('cx').onchange=e=>{grab();dr.color=e.target.value;draw()};
    sh.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{grab();m=b.dataset.m;draw()});
    if(m==='manual'){
      sh.querySelectorAll('#imp button').forEach(b=>b.onclick=()=>{grab();dr.imp=+b.dataset.i;draw()});
      g('ok').onclick=async e=>{
        grab();if(!dr.title.trim()){g('f_t').focus();return}
        const btn=e.currentTarget;btn.disabled=true;
        const row={title:dr.title.trim(),details:dr.details.trim(),date:dr.date,color:dr.color,imp:dr.imp};
        try{
          if(edit)await updTask(t,row);else{await addTasks([{...row,done:false}]);sel=dr.date}
          close();render();
        }catch(err){toast('Speichern fehlgeschlagen: '+err.message);btn.disabled=false}
      };
      if(edit){
        g('del').onclick=async()=>{try{await delTask(t);close();render()}catch(err){toast('Löschen fehlgeschlagen')}};
        g('help').onclick=async e=>{
          const out=g('hout'),btn=e.currentTarget;out.hidden=false;btn.disabled=true;out.textContent='Denke nach …';
          try{const r=await callFn('ai',{mode:'help',title:t.title,details:t.details});out.textContent=r.text;await updTask(t,{note:r.text})}
          catch(err){out.textContent='KI-Anfrage fehlgeschlagen: '+err.message}
          btn.disabled=false};
      }
    }else{
      const fi=g('f_f');
      g('pick').onclick=()=>fi.click();
      fi.onchange=async e=>{
        grab();const list=[...e.target.files],am=g('amsg');
        for(const f of list){
          if(f.size>15e6){st=f.name+' ist zu gross (max. 15 MB).';continue}
          am.textContent='Lese '+f.name+' …';
          try{files.push({name:f.name,text:await readFile(f)});st='Du musst keinen Tag angeben. Die KI ordnet alles selbst den Tagen zu.'}
          catch(err){const c=err.message;st=c==='doc'?'Altes .doc wird nicht unterstützt. Bitte als .docx speichern.':c==='empty'?f.name+': kein Text gefunden (gescanntes PDF?).':'Datei konnte nicht gelesen werden: '+f.name}
        }
        draw()};
      sh.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{grab();files.splice(+b.dataset.r,1);draw()});
      g('go').onclick=async e=>{
        grab();const am=g('amsg'),btn=e.currentTarget;
        if(!prompt.trim()&&!files.length){am.textContent='Bitte Text eingeben oder eine Datei anhängen.';return}
        btn.disabled=true;am.textContent='KI arbeitet … bei einem ganzen Monatsplan kann das eine Minute dauern.';
        try{
          const material=files.map(f=>`### ${f.name}\n${f.text}`).join('\n\n');
          const r=await callFn('ai',{mode:'plan',prompt,material,today:TODAY});
          const rows=r.tasks.map(x=>({title:x.title,details:x.details||'',date:x.date,color:dr.color,imp:x.importance||0,done:false}));
          await addTasks(rows);
          const first=rows.map(x=>x.date).sort()[0];
          sel=first&&first>=TODAY?first:TODAY;tab='cal';cv='week';
          close();render();toast(rows.length+' Aufgaben erstellt');
        }catch(err){am.textContent='Das hat nicht geklappt: '+err.message;btn.disabled=false}
      };
    }
  }
  document.body.appendChild(bg);draw();
}

/* ---------- Start ---------- */
(async function boot(){
  applyTheme();
  if(SUPABASE_URL.includes('DEIN-PROJEKT')){render();return}
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'){U=null;PROFILE=null;TASKS=[];USERS=null;render()}});
  const {data}=await sb.auth.getSession();
  if(data.session){U=data.session.user;try{await loadAll()}catch(e){toast('Laden fehlgeschlagen')}}
  render();
})();
</script>
